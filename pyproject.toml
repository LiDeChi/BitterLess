[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitterless"
version = "0.1.0"
description = "BitterLess — Eastern Zhou Lab: mind–model–world simulation kernel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LiDeChi", email = "parsonjian@163.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
web = []

[project.scripts]
bitterless = "bitterless.demo.cli:main"
bitterless-web = "bitterless.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
bitterless = ["web/static/**/*"]
